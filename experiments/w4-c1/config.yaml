# W4 并发扫描 c=1：W4 自己的控制组。与 w3-control 的区别是 timing=real（W3 是 compressed，两者不可同表）。
# w4-c{2,4,8} 与本文件只差 replay.concurrency 一项。KV 池 78k token、prompt P50 22k，c≥4 时同飞 prompt 之和超过池子。
name: w4-c1
notes: W4 并发扫描的控制组（c=1, real）。三次重跑报方差。
traces:
  dir: traces
  include: "*.jsonl"
  min_requests: 1
  order: sorted
server:
  base_url: http://127.0.0.1:30000/v1
  model: Qwen/Qwen3-8B-FP8
  metrics_url: http://127.0.0.1:30000/metrics
replay:
  concurrency: 1
  timing: real         # W4 看并发下的重叠与驱逐，必须保留真实间隔（decisions 2026-09-19）
  gap_scale: 1.0
  max_gap_s: 30        # 人类思考间隔封顶
  output_mode: recorded
  ignore_eos: true
  compaction: synthesize
  warmup_requests: 2
transform:
  name: identity
  params: {}
fingerprint: /root/autodl-tmp/fingerprints/serve-latest.json
