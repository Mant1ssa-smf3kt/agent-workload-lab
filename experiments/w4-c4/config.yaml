# W4 并发扫描 c=4。与 w4-c1 只差 replay.concurrency。也是 w4-c4-timestamp 的控制组。
name: w4-c4
notes: W4 并发扫描 c=4。与 w4-c1 只差 concurrency。同飞 prompt 之和开始超过 KV 池。
traces:
  dir: traces
  include: "*.jsonl"
  min_requests: 1
  order: sorted
server:
  base_url: http://127.0.0.1:30000/v1
  model: Qwen/Qwen3-8B-FP8
  metrics_url: http://127.0.0.1:30000/metrics
replay:
  concurrency: 4
  timing: real         # W4 看并发下的重叠与驱逐，必须保留真实间隔（decisions 2026-09-19）
  gap_scale: 1.0
  max_gap_s: 30        # 人类思考间隔封顶
  output_mode: recorded
  ignore_eos: true
  compaction: synthesize
  warmup_requests: 2
transform:
  name: identity
  params: {}
fingerprint: /root/autodl-tmp/fingerprints/serve-latest.json
