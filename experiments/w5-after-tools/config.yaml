# W5 批 1 可选组：同一条时间戳作为第二条 system 消息，渲染在 tools 块之后。与 w5-control 只差 transform。
# 用途：说明「头内部换位置」救不回来——tools 段只有 ~0.8k tok，历史仍每轮重 prefill。预测命中 0.14（estimate.md）。可砍。
name: w5-after-tools
notes: W5 批 1 可选组 system_timestamp@after_tools。与 w5-control 只差 transform。可砍。
traces:
  dir: traces
  include: "*.jsonl"
  min_requests: 1
  order: sorted
server:
  base_url: http://127.0.0.1:30000/v1
  model: Qwen/Qwen3-8B-FP8
  metrics_url: http://127.0.0.1:30000/metrics
replay:
  concurrency: 1
  timing: compressed   # 单并发无驱逐压力，间隔期间服务器空闲；命中率与 TTFT 与 real 一致，省 ~30% 机时（decisions 2026-09-19）
  gap_scale: 1.0
  max_gap_s: 30        # compressed 下不生效，保留以便切回 real
  output_mode: recorded
  ignore_eos: true
  compaction: synthesize
  warmup_requests: 2
transform:
  name: system_timestamp
  params:
    position: after_tools   # 同一条时间戳，作为第二条 system 消息（模板把它渲染在 tools 块之后）；历史仍每轮重 prefill
fingerprint: /root/autodl-tmp/fingerprints/serve-latest.json
