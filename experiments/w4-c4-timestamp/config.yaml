# W4：把 W3 头条改写放到并发下。与 w4-c4 只差 transform（system_timestamp）。
# 单并发下该改写每 run 制造 ~1770 万可驱逐 token（w3-timestamp summary.json metrics_after − before）；并发下会挤占其他轨迹的前缀。
name: w4-c4-timestamp
notes: W4：头条改写 system_timestamp 在 c=4 下。与 w4-c4 只差 transform。
traces:
  dir: traces
  include: "*.jsonl"
  min_requests: 1
  order: sorted
server:
  base_url: http://127.0.0.1:30000/v1
  model: Qwen/Qwen3-8B-FP8
  metrics_url: http://127.0.0.1:30000/metrics
replay:
  concurrency: 4
  timing: real         # W4 看并发下的重叠与驱逐，必须保留真实间隔（decisions 2026-09-19）
  gap_scale: 1.0
  max_gap_s: 30        # 人类思考间隔封顶
  output_mode: recorded
  ignore_eos: true
  compaction: synthesize
  warmup_requests: 2
transform:
  name: system_timestamp
  params: {}
fingerprint: /root/autodl-tmp/fingerprints/serve-latest.json
