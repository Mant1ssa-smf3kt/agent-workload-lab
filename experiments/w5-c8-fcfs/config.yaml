# W5 批 3 变量组：与 w5-c8-lpm 配置逐字节相同；唯一差异在 server 端：SCHEDULE_POLICY=fcfs bash scripts/serve.sh
# （fcfs 是 sglang 0.5.20 的出厂默认；lpm 是本项目的选择）。差异只存在于指纹 serve.serve_args，
# analysis/report 把 `serve.--schedule-policy` 当作一个变量对照（compare 校验恰好一个）。
# 检验 findings 7（LPM 饥饿回路，目前标「推断」）：预测 ≥ 600 s 的成对超时消失、命中率下降 X 点——一个真实 trade-off。
# 需要重启 server 换策略，不能与 lpm 组放在同一个 run-batch 里。
name: w5-c8-fcfs
notes: W5 批 3 变量组：server 用 SCHEDULE_POLICY=fcfs 启动；配置与 w5-c8-lpm 逐字节相同，变量在指纹 serve_args。
traces:
  dir: traces
  include: "*.jsonl"
  min_requests: 1
  order: sorted
server:
  base_url: http://127.0.0.1:30000/v1
  model: Qwen/Qwen3-8B-FP8
  metrics_url: http://127.0.0.1:30000/metrics
replay:
  concurrency: 8
  timing: real         # W4 看并发下的重叠与驱逐，必须保留真实间隔（decisions 2026-09-19）
  gap_scale: 1.0
  max_gap_s: 30        # 人类思考间隔封顶
  output_mode: recorded
  ignore_eos: true
  compaction: synthesize
  warmup_requests: 2
transform:
  name: identity
  params: {}
fingerprint: /root/autodl-tmp/fingerprints/serve-latest.json
