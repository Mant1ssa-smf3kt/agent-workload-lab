[project]
name = "agent-workload-lab"
version = "0.1.0"
description = "Characterize coding-agent workload against LLM serving; replay pi trajectories to SGLang and measure cache/scheduling effects of harness-side context assembly."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.2",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "pandas-stubs>=2.2",
    "types-PyYAML>=6.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["analysis", "replay", "metrics"]

[tool.uv]
# 国内网络：pip 走国内源（CLAUDE.md §6）
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["extension", "traces", "experiments/*/out"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ANN", "T20"]
# RUF001-003：报告与注释是中文，全角标点是正常的
ignore = ["ANN401", "RUF001", "RUF002", "RUF003"]
# T20: print 禁止（CLAUDE.md §10 日志用结构化 JSON 行）；测试里放开。
[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["ANN", "T20"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
packages = ["analysis", "replay", "metrics"]
exclude = ["extension/", "traces/"]

[tool.pytest.ini_options]
testpaths = ["analysis", "replay", "metrics"]
addopts = "-q"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
